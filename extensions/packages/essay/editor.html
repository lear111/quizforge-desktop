<div class="qf-type-page qf-type-editor">
    <h2 data-title></h2>
    <p class="muted" data-hint></p>
    <section class="qf-editor-section"><strong>题干／文章</strong>
        <div data-prompt></div>
    </section>
    <div class="qf-type-actions"><button type="button" data-sync>同步正文标记</button><button type="button" data-add-item>＋
            新增小题</button></div>
    <div data-items></div>
    <section class="qf-editor-section"><strong data-score-label></strong><input type="number" data-score min="0.01"
            step="0.5" aria-label="分值"></section>
    <section class="qf-editor-section"><strong>答案与解析</strong>
        <div data-analysis></div>
    </section>
</div>
