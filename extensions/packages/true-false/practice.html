<!-- 同一页面用于练习、草稿、历史与只读预览；差异由 practice.js 读取宿主能力决定。 -->
<section class="qf-judgment-practice">
  <div class="qf-type-heading"><span data-type-label class="qf-type-tag"></span><span data-question-position
      class="muted"></span></div>
  <div class="qf-type-meta"><span data-max-score></span><span data-answer-state></span></div>
  <!-- 题干是数据，通过 textContent 填入；HTML 中只写固定 UI，不写真实题目或标准答案。 -->
  <div data-prompt class="qf-choice-prompt"></div>
  <p data-choice-hint class="qf-choice-hint muted"></p>
  <!-- radio 保留原生键盘操作。用户选择通过 QF.save(draft) 保存当前选项 ID。 -->
  <div class="qf-judgment-options" role="radiogroup" aria-label="判断结果">
    <label class="qf-choice-option"><input type="radio" name="judgment-answer" data-answer-true><span class="qf-judgment-symbol" aria-hidden="true">✓</span><span class="qf-option-text">正确</span><span class="qf-option-feedback" hidden></span></label>
    <label class="qf-choice-option"><input type="radio" name="judgment-answer" data-answer-false><span class="qf-judgment-symbol" aria-hidden="true">×</span><span class="qf-option-text">错误</span><span class="qf-option-feedback" hidden></span></label>
  </div>
  <!-- 自己绘制提交/重试，因此 JS 隐藏了同名公共 UI；接口仍交给应用执行事务。 -->
  <div class="qf-type-actions" data-answer-actions>
    <button type="button" data-submit-answer class="primary" hidden>提交答案</button><button type="button" data-retry-answer
      hidden>↻ 重新作答</button>
  </div>
  <!-- 本例自行确认，不使用宿主默认确认面板。点击确认才调用 QF.save(submit)。 -->
  <section data-answer-confirm class="qf-inline-confirm" hidden>
    <span>确认提交这道题的答案吗？</span><button type="button" data-cancel-answer>继续作答</button><button type="button"
      data-confirm-answer class="primary">确认提交</button>
  </section>
  <!-- 提交后或历史中才显示：从 onLoad 的 attempt.result 读结果，不在页面判分。 -->
  <section data-result class="qf-result-panel" hidden>
    <div class="qf-result-heading">
      <p data-verdict></p>
      <p data-score class="qf-result-score"></p>
    </div>
    <p data-correct-answer class="qf-correct-answer"></p>
    <div class="qf-result-analysis"><strong>答案与解析</strong>
      <div data-analysis></div>
    </div>
  </section>
  <section data-source-section class="qf-type-sources" hidden><strong>引用来源</strong>
    <div data-sources></div>
  </section>
  <!-- 模式提示和错误反馈；草稿开关、画笔、缩放与尝试导航由宿主在页面外提供。 -->
  <p data-stage-note class="muted"></p>
  <p data-qf-error class="practice-error" role="alert" hidden></p>
</section>
