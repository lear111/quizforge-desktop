<section class="qf-choice-editor">
  <header class="qf-type-heading qf-editor-heading">
    <div class="qf-heading-copy"><span class="qf-eyebrow">题目编辑</span><strong data-type-title>选择题</strong></div>
    <span data-bank-position class="muted"></span><button type="button" data-bank-save class="primary" hidden>保存题库</button>
  </header>
  <nav data-bank-actions class="qf-type-actions qf-editor-actions" aria-label="题目操作" hidden>
    <select data-bank-add aria-label="新增题目类型"></select>
    <button type="button" data-bank-duplicate>复制题目</button><button type="button" data-bank-delete class="quiet-danger">删除题目</button>
  </nav>
  <section data-delete-confirm class="qf-inline-confirm" hidden>
    <span>删除当前整张题卡？</span><button type="button" data-delete-cancel>取消</button><button type="button" data-delete-accept class="danger">确认删除</button>
  </section>
  <section class="qf-editor-section">
    <label class="qf-field"><span class="qf-field-title">题干</span><textarea data-prompt rows="4" placeholder="输入题目内容…"></textarea></label>
  </section>
  <section class="qf-editor-section">
    <div class="qf-section-heading"><strong>选项与正确答案</strong><button type="button" data-add-option>＋ 新增选项</button></div>
    <p data-options-hint class="muted">选择正确答案。</p><div data-options class="qf-edit-options"></div>
  </section>
  <section class="qf-editor-section qf-score-section">
    <label class="qf-field"><span class="qf-field-title">分值</span><span class="qf-score-input"><input data-score type="number" min="0.01" step="0.5"><span>分</span></span></label>
  </section>
  <section class="qf-editor-section">
    <div class="qf-section-heading"><strong>答案与解析</strong><span class="muted">支持富文本</span></div>
    <div data-analysis class="qf-analysis-editor"></div>
  </section>
  <section data-source-section class="qf-type-sources" hidden>
    <strong>引用来源</strong><div data-sources></div>
    <div class="qf-source-input"><input data-source-link placeholder="粘贴来源链接…" aria-label="来源链接"><button type="button" data-source-add>添加来源</button></div>
  </section>
  <p data-qf-error class="practice-error" role="alert" hidden></p>
</section>
